# ============================================
# Worker configuration (for API deployment)
# ============================================
name = "book-place-travel"
main = "src/worker/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "literary-footprints-db"
database_id = ""

# R2 Storage
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "literary-footprints-assets"

# AI binding
[ai]
binding = "AI"

[vars]
API_MODE = "cloudflare"
SITE_URL = "https://literary-footprints.pages.dev"
